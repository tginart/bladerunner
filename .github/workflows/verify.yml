name: Public source verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
jobs:
  public-source:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - run: cargo install dotslash --locked
      - uses: Swatinem/rust-cache@v2
        with:
          key: public-source-macos
      - name: Verify archived public source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/public-source"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" python3 -B \
            "$RUNNER_TEMP/public-source/tools_verify_release.py" \
            --output "$RUNNER_TEMP/release-check" --build --tests
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: public-source-verification
          path: ${{ runner.temp }}/release-check
